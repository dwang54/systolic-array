name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys verilator
          pip install -r requirements.txt
      # Ubuntu's apt Verilator is too old for cocotb 2.x simulation (it is fine for lint),
      # so CI simulates with Icarus and uses Verilator only for lint.
      - run: make test
      - run: make lint
      - run: make synth TOP=pe
